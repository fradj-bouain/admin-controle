spring:
  application:
    name: admincontrol-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/admincontrol}
    username: ${DB_USER:admincontrol}
    password: ${DB_PASSWORD:admincontrol}

  jpa:
    hibernate:
      ddl-auto: validate # le schema est piloté par Flyway, jamais par Hibernate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # Pas de spring.security.oauth2.resourceserver.jwt.issuer-uri : le JwtDecoder
  # est fourni par JwtConfig (JWT auto-émis par ce backend, pas d'IdP externe).

  # Non configuré par défaut (host vide) : tant que MAIL_HOST n'est pas fourni,
  # EmailService journalise l'envoi au lieu d'appeler un serveur SMTP inexistant.
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  mail-from: ${MAIL_FROM:no-reply@admincontrol-btp.fr}
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:4200}

server:
  port: ${PORT:${SERVER_PORT:8080}}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    root: INFO
    com.fluttiris.admincontrol: DEBUG
